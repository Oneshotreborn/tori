<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Valentine's Day</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* Global reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6f0, #ffb3d9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff2f92;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            color: #444;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        button {
            background-color: #ff2f92;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 47, 146, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Valentine's Day RIRI!!!</h1>
        <p>Hope this finds you well, darling.</p>
        <a href="Page2.1.html"><button>Click Me</button></a>
    </div>

</body>
</html>
